services:
  api-gateway:
    image: node:22-alpine
    working_dir: /workspace/services/api-gateway
    command: npm run start
    environment:
      PORT: 4100
      HOTEL_SERVICE_URLS: http://hotel-service-a:4101,http://hotel-service-b:4101
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "4100:4100"
    volumes:
      - ..:/workspace
    depends_on:
      - hotel-service-a
      - hotel-service-b

  hotel-service-a:
    image: node:22-alpine
    working_dir: /workspace/services/hotel-service
    command: npm run start
    environment:
      PORT: 4101
      SERVICE_NAME: hotel-service-a
    volumes:
      - ..:/workspace

  hotel-service-b:
    image: node:22-alpine
    working_dir: /workspace/services/hotel-service
    command: npm run start
    environment:
      PORT: 4101
      SERVICE_NAME: hotel-service-b
    volumes:
      - ..:/workspace

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hotel_sistema
      POSTGRES_USER: hotel
      POSTGRES_PASSWORD: hotel
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: hotel
      MINIO_ROOT_PASSWORD: hotel-password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
